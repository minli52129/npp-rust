[package]
name = "npp-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "NppRust —— 用 Rust 编写的类 Notepad++ 多标签文本/代码编辑器"
license = "MIT"

[dependencies]
# GUI 框架(egui/eframe)
eframe = "0.36"
# 原生文件对话框(Windows/macOS 原生,Linux 走 xdg 桌面门户,无需 GTK)
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# 字符编码转换(UTF-8/UTF-16/GBK/Big5/CP1252)
encoding_rs = "0.8"
# 正则查找替换
regex = "1"
# 设置持久化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地时间(F5 插入日期时间)
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 2
lto = "thin"
